<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{{TITLE}}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-U1DAWAznBHeqEIlVSCgzq+c9gqGAJn5c/t99JyeKa9xxaYpSvHU5awsuZVVFIhvj" crossorigin="anonymous"></script>
    <script type="text/javascript" async
      src="https://cdn.jsdelivr.net/npm/mathjax@2/MathJax.js?config=TeX-AMS_CHTML">
    </script>
    <script type="text/javascript">
      window.addEventListener("load", () => {
        for (let i of document.querySelectorAll(".collapse ul")) {
          let tog = document.createElement("div");
          tog.innerHTML = i.previousSibling.textContent;
          tog.className = "toggle";
          tog.onclick = () => tog.classList.toggle("show");
          i.parentElement.removeChild(i.previousSibling);
          i.parentElement.insertBefore(tog, i);
        }
      });
      // Open the collapsible demo an "#example" link points to, then scroll to
      // it.  getElementById (not querySelector) matches ids that contain a dot,
      // e.g. "Class.method-example1".
      function openHashTarget () {
        if (! window.location.hash) { return; }
        let el = document.getElementById (
          decodeURIComponent (window.location.hash.slice (1)));
        if (! el) { return; }
        if (el.classList.contains ("collapse") &&
            ! el.classList.contains ("show")) {
          bootstrap.Collapse.getOrCreateInstance (el).show ();
        }
        el.scrollIntoView ();
      }
      window.addEventListener ("DOMContentLoaded", openHashTarget);
      window.addEventListener ("hashchange", openHashTarget);
      // When the collapsible named by the current URL fragment is collapsed,
      // drop the fragment (replaceState: no scroll, no history entry).  Otherwise
      // the fragment would still equal this id, so clicking the same #example
      // link again fires no "hashchange" and the example would not re-expand.
      document.addEventListener ("hide.bs.collapse", (e) => {
        if (e.target.id && window.location.hash === "#" + e.target.id) {
          history.replaceState (null, "",
            window.location.pathname + window.location.search);
        }
      });
      // Let the browser's find-in-page reach the text inside a collapsed
      // panel.  The attribute "hidden=until-found" is what makes content
      // searchable and revealable; the style block below clears the
      // "display: none" that would otherwise stop the attribute meaning
      // anything, a box that is not generated having nothing to reveal.  Set
      // it only where it is understood, which "content-visibility" is no test
      // for, Firefox having shipped the two apart.  Where it is not, the panel
      // keeps the user agent's plain [hidden] and the page behaves as before.
      window.addEventListener ("DOMContentLoaded", () => {
        if (! ("onbeforematch" in document.body)) { return; }
        document.documentElement.classList.add ("until-found");
        let panels = document.querySelectorAll (
          ".collapse:not(.show):not(.navbar-collapse)");
        for (let el of panels) {
          el.setAttribute ("hidden", "until-found");
          // Fired on a find-in-page hit, before the browser drops the
          // attribute and scrolls to it.  Bootstrap keeps a panel's state in
          // its class list, so adding the class here opens the panel in the
          // same frame and leaves the button shutting it correctly afterwards.
          // Bootstrap's own show () would animate against that scroll, and the
          // attribute once dropped, "display: none" would take the panel back
          // part way through.
          el.addEventListener ("beforematch", () => {
            el.classList.add ("show");
            for (let b of document.querySelectorAll ("[data-bs-target]")) {
              if (b.getAttribute ("data-bs-target") === "#" + el.id) {
                b.setAttribute ("aria-expanded", "true");
              }
            }
          });
        }
        // Drop the attribute before Bootstrap measures the panel it is opening,
        // which it does after firing this; a revealable one measures nothing.
        document.addEventListener ("show.bs.collapse", (e) => {
          e.target.removeAttribute ("hidden");
        });
        // Restore it once the panel is shut, rather than while it is shutting.
        document.addEventListener ("hidden.bs.collapse", (e) => {
          if (! e.target.classList.contains ("navbar-collapse")) {
            e.target.setAttribute ("hidden", "until-found");
          }
        });
      });
    </script>
    <style>
    .fs {
    margin-top: -0.15em;

    code.description {
    font-family: Consolas, "Courier New", monospace;
    border-radius: 0.3em;
    white-space: normal;
    font-size:1.2em;
    color: gray;
    }
    var {
    font-family: Consolas, "Courier New", monospace;
    border-radius: 0.3em;
    font-style: normal;
    font-weight: bold;
    color: gray;
    }
    td {
      vertical-align: top;
    }
    [id^="togList"],                        /* HIDE CHECKBOX */
    [id^="togList"] ~ .list,                /* HIDE LIST */
    [id^="togList"] + label  span + span,   /* HIDE "Collapse" */
    [id^="togList"]:checked + label span{   /* HIDE "Expand" (IF CHECKED) */
      display:none;
    }
    [id^="togList"]:checked + label span + span{
      display:inline-block;                 /* SHOW "Collapse" (IF CHECKED) */
    }
    [id^="togList"]:checked ~ .list{
      display:block;                        /* SHOW LIST (IF CHECKED) */
    }
    /* Bootstrap hides a collapsed panel with "display: none", which generates
       no box, so the "content-visibility: hidden" the user agent gives
       "hidden=until-found" could never apply and the text would stay beyond
       find-in-page.  Clear that one declaration, and only where the script
       above has found the attribute to be understood: an attribute selector
       matches a value the browser does not understand, so an ungated rule
       would leave every panel of an older browser standing open.  The
       "!important" is required rather than decoration: the reboot carries
       "[hidden] {display: none !important}", which the attribute itself brings
       into play, and only another "!important" can outrank it. */
    html.until-found .collapse[hidden="until-found"]:not(.show) {
      display: block !important;
    }
    </style>
